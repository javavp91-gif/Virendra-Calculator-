<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#173453">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="Virendra Calculator">
<title>Virendra Calculator</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Virendra">

<style>
:root{--navy:#173453;--muted:#64748b;--bg:#eef3f9;--card:#fff;--line:#cbd5e1;--gold:#fff0c9;--goldt:#7b6027}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#193653;font-family:Arial,Helvetica,sans-serif}
.top{background:var(--navy);height:74px}.head{padding-top:28px}.head{padding:28px 38px 30px;max-width:760px;margin:auto}.head h1{font-size:30px;margin:0}.head p{font-size:18px;color:var(--muted);margin:10px 0 0}
.wrap{max-width:720px;margin:auto;padding:0 20px 35px}.card{background:#fff;border-radius:32px;padding:30px 30px 24px;box-shadow:0 3px 15px #17345312}
h2{margin:3px 0 28px;font-size:25px}.row{margin-bottom:16px}.row label{display:block;font-size:19px;font-weight:700;margin-bottom:8px}
input,select{width:100%;height:61px;border:1.5px solid var(--line);border-radius:17px;background:#f8fafc;padding:0 18px;color:var(--navy);font-size:24px;outline:none}
input:focus,select:focus{border-color:var(--navy);box-shadow:0 0 0 3px #17345318}
.unitrow{display:flex;gap:8px}.unit{max-width:115px;font-size:18px}
.note{font-size:16px;color:var(--muted);line-height:1.55;margin:8px 0 22px}
.result{background:var(--gold);border-radius:24px;padding:27px 15px;text-align:center;color:var(--goldt)}.result .rtitle{font-size:20px}.answer{font-size:43px;font-weight:800;color:var(--navy);margin-top:12px}
.clear{border:0;background:transparent;color:var(--muted);font-size:18px;display:block;margin:26px auto 0;cursor:pointer}
.navTitle{margin:28px 0 14px;text-align:center;font-size:17px;font-weight:900;letter-spacing:.8px;color:#64748b}
.nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px 10px;margin:0;padding-bottom:6px}
.nav button{position:relative;isolation:isolate;overflow:hidden;min-height:96px;border:1.5px solid rgba(255,255,255,.96);border-radius:26px;color:#173453;font-size:18px;font-weight:900;cursor:pointer;padding:13px 7px 15px;line-height:1.18;text-align:center;text-shadow:0 1px 0 rgba(255,255,255,.82);transition:transform .12s ease,box-shadow .12s ease,filter .12s ease;transform:translateY(0)}
.nav button:before{content:'';position:absolute;z-index:-1;left:-12%;top:-26%;width:92%;height:78%;border-radius:50%;background:radial-gradient(ellipse at center,rgba(255,255,255,.95) 0%,rgba(255,255,255,.55) 42%,rgba(255,255,255,0) 73%);transform:rotate(-10deg);pointer-events:none}
.nav button:after{content:'';position:absolute;z-index:-1;inset:5px 5px 7px;border-radius:21px;border:1px solid rgba(255,255,255,.42);box-shadow:inset 0 -10px 18px rgba(90,105,120,.05),inset 0 8px 14px rgba(255,255,255,.26);pointer-events:none}
.nav button:hover{transform:translateY(-2px);filter:saturate(1.05)}
.nav button:active{transform:translateY(5px) scale(.985);filter:saturate(1.08)}
.nav button.active{border-color:rgba(136,164,196,.88);outline:2px solid rgba(255,255,255,.82);outline-offset:-4px}
.nav button:nth-child(6n+1){background:linear-gradient(155deg,#fff1f6 0%,#ffe2ec 38%,#ffd1e0 100%);box-shadow:inset 0 2px 4px rgba(255,255,255,.88),inset 0 -9px 14px rgba(175,64,105,.08),0 7px 0 #efc1d0,0 13px 22px rgba(156,72,104,.12)}
.nav button:nth-child(6n+2){background:linear-gradient(155deg,#f2fdea 0%,#e2f7d5 42%,#d3efc6 100%);box-shadow:inset 0 2px 4px rgba(255,255,255,.88),inset 0 -9px 14px rgba(77,130,61,.08),0 7px 0 #bfdbb2,0 13px 22px rgba(72,122,59,.10)}
.nav button:nth-child(6n+3){background:linear-gradient(155deg,#fff4ea 0%,#ffe6d0 42%,#ffd7b7 100%);box-shadow:inset 0 2px 4px rgba(255,255,255,.88),inset 0 -9px 14px rgba(175,96,43,.08),0 7px 0 #efc8a4,0 13px 22px rgba(160,91,44,.10)}
.nav button:nth-child(6n+4){background:linear-gradient(155deg,#f0fdff 0%,#dbf7fb 42%,#cbeff6 100%);box-shadow:inset 0 2px 4px rgba(255,255,255,.88),inset 0 -9px 14px rgba(53,128,146,.07),0 7px 0 #b9dfe7,0 13px 22px rgba(49,117,135,.10)}
.nav button:nth-child(6n+5){background:linear-gradient(155deg,#f7f1ff 0%,#ede2ff 42%,#e0d0fb 100%);box-shadow:inset 0 2px 4px rgba(255,255,255,.88),inset 0 -9px 14px rgba(106,76,153,.07),0 7px 0 #d0bce9,0 13px 22px rgba(91,66,133,.10)}
.nav button:nth-child(6n+6){background:linear-gradient(155deg,#fffcea 0%,#fff5cd 42%,#ffecad 100%);box-shadow:inset 0 2px 4px rgba(255,255,255,.90),inset 0 -9px 14px rgba(166,124,31,.07),0 7px 0 #e7d59b,0 13px 22px rgba(151,113,30,.10)}
.nav button:nth-child(6n+1):active{box-shadow:inset 0 2px 4px rgba(255,255,255,.75),0 2px 0 #efc1d0,0 7px 12px rgba(156,72,104,.12)}
.nav button:nth-child(6n+2):active{box-shadow:inset 0 2px 4px rgba(255,255,255,.75),0 2px 0 #bfdbb2,0 7px 12px rgba(72,122,59,.10)}
.nav button:nth-child(6n+3):active{box-shadow:inset 0 2px 4px rgba(255,255,255,.75),0 2px 0 #efc8a4,0 7px 12px rgba(160,91,44,.10)}
.nav button:nth-child(6n+4):active{box-shadow:inset 0 2px 4px rgba(255,255,255,.75),0 2px 0 #b9dfe7,0 7px 12px rgba(49,117,135,.09)}
.nav button:nth-child(6n+5):active{box-shadow:inset 0 2px 4px rgba(255,255,255,.75),0 2px 0 #d0bce9,0 7px 12px rgba(91,66,133,.09)}
.nav button:nth-child(6n+6):active{box-shadow:inset 0 2px 4px rgba(255,255,255,.76),0 2px 0 #e7d59b,0 7px 12px rgba(151,113,30,.09)}

/* Select Tools: same light-blue 3D colour for every tool */
.nav button{background:linear-gradient(155deg,#f0fdff 0%,#dbf7fb 42%,#cbeff6 100%)!important;box-shadow:inset 0 2px 4px rgba(255,255,255,.88),inset 0 -9px 14px rgba(53,128,146,.07),0 7px 0 #b9dfe7,0 13px 22px rgba(49,117,135,.10)!important}
.nav button:active{box-shadow:inset 0 2px 4px rgba(255,255,255,.75),0 2px 0 #b9dfe7,0 7px 12px rgba(49,117,135,.09)!important}

.hidden{display:none}.menuTitle{margin-bottom:20px}
