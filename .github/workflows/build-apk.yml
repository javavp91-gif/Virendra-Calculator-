name: Build Virendra Calculator APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'version.json'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android project
        shell: bash
        run: |
          set -e
          mkdir -p android-app/app/src/main/java/com/virendra/calculator
          mkdir -p android-app/app/src/main/assets
          mkdir -p android-app/app/src/main/res/drawable
          mkdir -p android-app/app/src/main/res/mipmap-anydpi-v26
          mkdir -p android-app/app/src/main/res/values
          mkdir -p android-app/app/src/main/res/xml
          cp index.html android-app/app/src/main/assets/index.html

          cat > android-app/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'VirendraCalculator'
          include ':app'
          EOF

          cat > android-app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > android-app/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }

          android {
              namespace 'com.virendra.calculator'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.virendra.calculator'
                  minSdk 24
                  targetSdk 35
                  versionCode 110
                  versionName '1.1.0'
              }
          }
          EOF

          cat > android-app/app/src/main/res/values/colors.xml <<'EOF'
          <resources><color name="navy">#173453</color><color name="white">#FFFFFF</color></resources>
          EOF

          cat > android-app/app/src/main/res/values/themes.xml <<'EOF'
          <resources>
            <style name="Theme.VirendraCalculator" parent="android:style/Theme.Material.Light.NoActionBar">
              <item name="android:fontFamily">sans</item>
              <item name="android:colorAccent">#173453</item>
              <item name="android:navigationBarColor">#173453</item>
              <item name="android:statusBarColor">#173453</item>
              <item name="android:windowLightStatusBar">false</item>
            </style>
          </resources>
          EOF

          cat > android-app/app/src/main/res/drawable/app_icon.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#173453" android:pathData="M12,4h84a8,8 0,0 1,8 8v84a8,8 0,0 1,-8 8h-84a8,8 0,0 1,-8 -8v-84a8,8 0,0 1,8 -8z"/>
            <path android:fillColor="#FFFFFF" android:pathData="M26,24 L43,84 L55,84 L82,24 L68,24 L50,67 L39,24 Z"/>
            <path android:fillColor="#8FD7E8" android:pathData="M70,62h22v6h-22zM70,73h22v6h-22zM70,84h22v6h-22z"/>
          </vector>
          EOF

          cat > android-app/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/navy"/><foreground android:drawable="@drawable/app_icon"/></adaptive-icon>
          EOF

          cat > android-app/app/src/main/res/xml/file_paths.xml <<'EOF'
          <paths xmlns:android="http://schemas.android.com/apk/res/android"><cache-path name="cache" path="."/></paths>
          EOF

          cat > android-app/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
            <application android:allowBackup="true" android:usesCleartextTraffic="false" android:theme="@style/Theme.VirendraCalculator" android:label="Virendra Calculator" android:icon="@drawable/app_icon" android:roundIcon="@drawable/app_icon">
              <activity android:name=".MainActivity" android:screenOrientation="unspecified" android:configChanges="orientation|screenSize|keyboardHidden" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat > android-app/app/src/main/java/com/virendra/calculator/MainActivity.java <<'EOF'
          package com.virendra.calculator;

          import android.app.*;
          import android.os.*;
          import android.content.*;
          import android.graphics.Color;
          import android.net.*;
          import android.provider.MediaStore;
          import android.util.Base64;
          import android.webkit.*;
          import android.widget.Toast;
          import java.io.OutputStream;

          public class MainActivity extends Activity {
              private WebView webView;
              private ValueCallback<Uri[]> filePathCallback;
              private static final int FILE_CHOOSER = 1001;

              @Override public void onCreate(Bundle b) {
                  super.onCreate(b);
                  webView = new WebView(this);
                  setContentView(webView);
                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.JELLY_BEAN) {
                      s.setAllowFileAccessFromFileURLs(true);
                      s.setAllowUniversalAccessFromFileURLs(true);
                  }
                  webView.setBackgroundColor(Color.WHITE);
                  webView.addJavascriptInterface(new Bridge(), "AndroidBridge");
                  webView.setWebViewClient(new WebViewClient() {
                      @Override public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          injectDownloadBridge();
                      }
                  });
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override public boolean onShowFileChooser(WebView w, ValueCallback<Uri[]> cb, FileChooserParams p) {
                          if (filePathCallback != null) filePathCallback.onReceiveValue(null);
                          filePathCallback = cb;
                          try {
                              Intent i = p.createIntent();
                              startActivityForResult(i, FILE_CHOOSER);
                              return true;
                          } catch (Exception e) {
                              filePathCallback = null;
                              Toast.makeText(MainActivity.this, "File picker नहीं खुला", Toast.LENGTH_SHORT).show();
                              return false;
                          }
                      }
                  });
                  webView.loadUrl("file:///android_asset/index.html");
              }

              private void injectDownloadBridge() {
                  String js = "(function(){if(window.__vcBridge)return;window.__vcBridge=1;document.addEventListener('click',async function(e){var a=e.target&&e.target.closest?e.target.closest('a[download]'):null;if(!a||!a.href)return;if(a.href.indexOf('blob:')!==0&&a.href.indexOf('data:')!==0)return;e.preventDefault();try{var r=await fetch(a.href);var b=await r.blob();var fr=new FileReader();fr.onloadend=function(){var x=String(fr.result||'');var k=x.indexOf(',');if(k>=0)AndroidBridge.saveBase64(a.download||'download',b.type||'application/octet-stream',x.substring(k+1));};fr.readAsDataURL(b);}catch(err){console.log(err);}},true);})();";
                  webView.evaluateJavascript(js, null);
              }

              @Override protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == FILE_CHOOSER && filePathCallback != null) {
                      Uri[] results = WebChromeClient.FileChooserParams.parseResult(resultCode, data);
                      filePathCallback.onReceiveValue(results);
                      filePathCallback = null;
                  }
              }

              @Override public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) webView.goBack(); else super.onBackPressed();
              }

              public class Bridge {
                  @JavascriptInterface public void saveBase64(String fileName, String mime, String base64) {
                      runOnUiThread(() -> {
                          try {
                              byte[] bytes = Base64.decode(base64, Base64.DEFAULT);
                              ContentValues values = new ContentValues();
                              values.put(MediaStore.Downloads.DISPLAY_NAME, fileName == null || fileName.isEmpty() ? "Virendra_Download" : fileName);
                              values.put(MediaStore.Downloads.MIME_TYPE, mime == null || mime.isEmpty() ? "application/octet-stream" : mime);
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) values.put(MediaStore.Downloads.RELATIVE_PATH, "Download/Virendra Calculator");
                              Uri uri = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                              if (uri == null) throw new Exception("save uri");
                              try (OutputStream os = getContentResolver().openOutputStream(uri)) { os.write(bytes); }
                              Toast.makeText(MainActivity.this, "Downloaded: " + fileName, Toast.LENGTH_SHORT).show();
                          } catch (Exception e) {
                              Toast.makeText(MainActivity.this, "Download save नहीं हुआ", Toast.LENGTH_SHORT).show();
                          }
                      });
                  }
              }
          }
          EOF

      - name: Build APK
        working-directory: android-app
        run: gradle --no-daemon assembleDebug

      - name: Name APK with app version
        shell: bash
        run: |
          VERSION=$(python3 -c "import json;print(json.load(open('version.json'))['version'])")
          cp android-app/app/build/outputs/apk/debug/app-debug.apk "Virendra-Calculator-v${VERSION}.apk"
          echo "APK_NAME=Virendra-Calculator-v${VERSION}.apk" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Virendra-Calculator-APK
          path: ${{ env.APK_NAME }}
          if-no-files-found: error
